name: quality gates

# Docs-only changes skip the code pipeline entirely. Most commits early on are
# documents, and running toolchains to check a markdown edit is how CI earns a
# reputation for wasting time.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Pure Python, finishes in seconds, and stack-agnostic. This is also everything
  # `python tools/run.py check` runs locally, so CI should never be the first
  # place you learn something is wrong. None of this is tied to a project's stack.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: no placeholder code
        run: python tools/no_placeholders.py

      - name: module boundaries
        run: python tools/dep_check.py

      - name: ownership boundary
        run: python tools/ownership_check.py ${{ github.event.pull_request.base.sha || 'origin/main' }}

      - name: tracker is consistent
        run: python tools/track.py check

      - name: tenant isolation (trespass)
        run: |
          SCHEMA=$(for p in supabase/migrations schema.sql db/schema.sql sql/schema.sql prisma/schema.prisma; do [ -e "$p" ] && echo "$p" && break; done)
          if [ -n "$SCHEMA" ]; then
            echo "proving tenant isolation on $SCHEMA"
            python tools/trespass/run.py check "$SCHEMA" --no-color
          else
            echo "no database schema yet, nothing to prove"
          fi

      - name: no secrets committed
        run: |
          if git log -p -1 | grep -nEi '^\+.*(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{12,}'; then
            echo "A secret appears in this diff. Rotate it, do not just remove it."
            exit 1
          fi

  # The language jobs. Stack is detected from standard manifest files, so this
  # works for any project without editing this file: /scaffold wires the actual
  # commands into the Makefile, and this just runs them with the right toolchains
  # set up. Until a stack exists, the manifests are absent and this is a no-op.
  code:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: detect stacks
        id: stacks
        run: |
          have() { find . -path ./node_modules -prune -o -name "$1" -print 2>/dev/null | grep -q . && echo yes || echo no; }
          echo "go=$([ -f go.mod ] && echo yes || echo no)" >> $GITHUB_OUTPUT
          echo "node=$([ -f package.json ] && echo yes || echo no)" >> $GITHUB_OUTPUT
          echo "py=$([ -f pyproject.toml ] || [ -f requirements.txt ] && echo yes || echo no)" >> $GITHUB_OUTPUT
          echo "rust=$([ -f Cargo.toml ] && echo yes || echo no)" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.stacks.outputs.go == 'yes'
        with: { go-version: "stable" }
      - uses: actions/setup-node@v4
        if: steps.stacks.outputs.node == 'yes'
        with: { node-version: "lts/*" }
      - uses: actions/setup-python@v5
        if: steps.stacks.outputs.py == 'yes'
        with: { python-version: "3.12" }

      # These call the Makefile targets that /scaffold wires to the chosen stack's
      # real linters, typecheckers, and test runners. Before /scaffold they are
      # safe no-ops, so this never blocks a project that has not wired its stack.
      - name: generated files in sync
        run: make gen && git diff --exit-code || (echo "Something generated is out of sync. Run 'make gen' and commit."; exit 1)
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: tests
        run: make test
