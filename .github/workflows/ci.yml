name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check keel_kit tests scripts template
      - name: Keel's own suite (init, tracker, gates, cockpit, hooks, vendor pin)
        run: pytest -q
      - name: Vendored trespass suite (Z3 differential included)
        run: pytest template/tools/trespass/tests -q
