name: publish to PyPI

# Publishes keel-kit to PyPI when you push a version tag, e.g. v0.1.0.
# Uses PyPI Trusted Publishing (OIDC): no token is stored anywhere. Set the
# trusted publisher up once on PyPI (see the release note below), then releasing
# is: bump __version__, commit, tag vX.Y.Z, push the tag. This workflow does the
# rest.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: the tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oE '__version__ = "[^"]+"' keel_kit/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  package=$VER"
          test "$TAG" = "$VER" || { echo "Tag v$TAG does not match keel_kit __version__ $VER. Bump one to match."; exit 1; }

      - name: build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
