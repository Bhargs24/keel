[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-kit"
dynamic = ["version"]
description = "An open-source AI product builder: take an idea to a shipped, production-grade product."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhargav Raghavendra" }]
keywords = [
  "ai", "product-builder", "spec-driven-development", "claude-code",
  "developer-tools", "scaffold", "agents", "prd", "idea-to-production",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Bhargs24/keel"
Repository = "https://github.com/Bhargs24/keel"
Issues = "https://github.com/Bhargs24/keel/issues"

[project.optional-dependencies]
# Test-only. The kit itself runs on the standard library alone.
dev = ["pytest>=8", "ruff", "z3-solver>=4.12"]

[project.scripts]
keel = "keel_kit:main"

[tool.hatch.version]
path = "keel_kit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# The vendored trespass copy stays byte-identical to its upstream pin;
# never lint or restyle it here.
extend-exclude = ["template/tools/trespass"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["keel_kit"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "keel_kit/template"

[tool.hatch.build.targets.sdist]
include = ["keel_kit", "template", "README.md", "LICENSE"]
