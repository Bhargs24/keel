<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- window -->
  <rect width="1040" height="660" rx="14" fill="#f7f6f3"/>
  <rect width="1040" height="46" rx="14" fill="#eeece7"/>
  <rect y="30" width="1040" height="16" fill="#eeece7"/>
  <circle cx="26" cy="23" r="6" fill="#e0655a"/>
  <circle cx="46" cy="23" r="6" fill="#e6b95c"/>
  <circle cx="66" cy="23" r="6" fill="#8bc48f"/>
  <rect x="360" y="13" width="320" height="20" rx="10" fill="#fbfaf8" stroke="#e2e0da"/>
  <text x="520" y="27" text-anchor="middle" font-size="11" fill="#8a897f" class="mono">127.0.0.1:7799  ·  Keel</text>

  <!-- header -->
  <text x="56" y="98" class="serif" font-size="30" font-weight="600" fill="#1a1a17">Keel</text>
  <text x="56" y="120" font-size="14" fill="#6b6a63">From your idea to a product you can ship. Here is your next step.</text>

  <!-- journey rail -->
  <g transform="translate(56,150)">
    <!-- Idea done -->
    <circle cx="14" cy="14" r="14" fill="#2f6f4f"/>
    <path d="M8 14 l4 4 l7 -8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="44" text-anchor="middle" font-size="11.5" fill="#6b6a63">Idea</text>
    <!-- Discover current -->
    <circle cx="140" cy="14" r="18" fill="#2f6f4f14"/>
    <circle cx="140" cy="14" r="14" fill="#2f6f4f"/>
    <text x="140" y="18" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">2</text>
    <text x="140" y="44" text-anchor="middle" font-size="11.5" fill="#1a1a17" font-weight="600">Discover</text>
    <!-- rest -->
    <g fill="#dedcd5">
      <circle cx="266" cy="14" r="14"/><circle cx="392" cy="14" r="14"/><circle cx="518" cy="14" r="14"/>
      <circle cx="644" cy="14" r="14"/><circle cx="770" cy="14" r="14"/><circle cx="896" cy="14" r="14"/>
    </g>
    <g fill="#8a897f" font-size="12" text-anchor="middle" font-weight="600">
      <text x="266" y="18">3</text><text x="392" y="18">4</text><text x="518" y="18">5</text>
      <text x="644" y="18">6</text><text x="770" y="18">7</text><text x="896" y="18">8</text>
    </g>
    <g fill="#6b6a63" font-size="11.5" text-anchor="middle">
      <text x="266" y="44">Define</text><text x="392" y="44">Design</text><text x="518" y="44">Architect</text>
      <text x="644" y="44">Check</text><text x="770" y="44">Build</text><text x="896" y="44">Ship</text>
    </g>
  </g>

  <!-- next step card -->
  <rect x="56" y="226" width="928" height="238" rx="16" fill="#ffffff" stroke="#e7e5df" filter="url(#s)"/>
  <text x="86" y="266" font-size="12" letter-spacing="1.4" fill="#2f6f4f" font-weight="700">YOUR NEXT STEP</text>
  <text x="86" y="300" class="serif" font-size="24" font-weight="600" fill="#1a1a17">Research what exists, and how yours is better</text>
  <text x="86" y="330" font-size="15" fill="#1a1a17">Before building anything, Keel checks what already exists and makes sure your idea is genuinely</text>
  <text x="86" y="351" font-size="15" fill="#1a1a17">better or newer, never a copy.</text>
  <text x="86" y="378" font-size="13.5" fill="#6b6a63">A specialist finds the existing products and writes an honest verdict on how yours stands apart.</text>

  <!-- command box -->
  <rect x="86" y="398" width="868" height="46" rx="11" fill="#2f6f4f14" stroke="#2f6f4f"/>
  <text x="104" y="426" class="mono" font-size="15" fill="#2f6f4f" font-weight="600">/discover</text>
  <rect x="878" y="408" width="62" height="26" rx="8" fill="#2f6f4f"/>
  <text x="909" y="425" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="600">Copy</text>

  <!-- produced docs -->
  <text x="56" y="512" font-size="12" letter-spacing="0.8" fill="#6b6a63" font-weight="700">WHAT KEEL HAS WRITTEN SO FAR</text>
  <text x="56" y="540" font-size="14" fill="#1a1a17" font-weight="600">Discover</text>
  <g font-size="13" fill="#1a1a17">
    <rect x="56" y="552" width="230" height="40" rx="10" fill="#fff" stroke="#e7e5df"/>
    <circle cx="78" cy="572" r="9" fill="#2f6f4f"/><path d="M74 572 l3 3 l5 -6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="576">PRIOR-ART</text>
    <rect x="298" y="552" width="230" height="40" rx="10" fill="#fff" stroke="#e7e5df"/>
    <circle cx="320" cy="572" r="9" fill="#dedcd5"/>
    <text x="338" y="576" fill="#8a897f">CONCEPT</text>
    <rect x="540" y="552" width="230" height="40" rx="10" fill="#fff" stroke="#e7e5df"/>
    <circle cx="562" cy="572" r="9" fill="#dedcd5"/>
    <text x="580" y="576" fill="#8a897f">MARKET-ANALYSIS</text>
    <rect x="782" y="552" width="202" height="40" rx="10" fill="#fff" stroke="#e7e5df"/>
    <circle cx="804" cy="572" r="9" fill="#dedcd5"/>
    <text x="822" y="576" fill="#8a897f">COMPETITORS</text>
  </g>
</svg>
